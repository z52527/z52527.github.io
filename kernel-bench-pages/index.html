ry，读取两条信息","paragraphs":["先忽略 scale 和 mask。假设 Q 与两个 K 算出的分数是 [1, 2]，对应的 V 是两个标量 [10, 20]。为了看清区别，这个例子选 ReLU；本轮实测的 GDPA 使用 GELU 近似。"],"table":{"headers":["处理方式","聚合权重","输出"],"rows":[["标准 softmax attention","softmax([1, 2]) ≈ [0.269, 0.731]","0.269×10 + 0.731×20 ≈ 17.31"],["GDPA · 这个例子用 ReLU","ReLU([1, 2]) = [1, 2]","1×10 + 2×20 = 50"]]},"after":["softmax 会让这一行的权重合计为 1；ReLU 不做这个归一化。换成 GELU 也不能把权重当作概率，甚至可能出现负权重。两边读的是同一份 V，但计算的不是同一个函数。"],"sources":[{"path":"gdpa/README.md","label":"定义与支持的激活：GDPA README"}]},{"title":"为什么普通 FA 需要修正之前的累加值？","paragraphs":["GPU 往往分批读取 K/V。仍用上面的两个分数：第一批只看到分数 1，第二批才看到分数 2。稳定 softmax 会减掉当前已知的最大值；最大值从 1 变成 2 时，旧批次的指数尺度也要跟着变化。"],"diagram":"第一批：score = 1，V = 10\n  当前最大值 m = 1\n  分子 A = exp(1−1) × 10 = 10\n  分母 Z = exp(1−1) = 1\n\n第二批：score = 2，V = 20；新的 m = 2\n  旧分子、旧分母先乘 exp(1−2)\n  A = exp(−1) × 10 + 20\n  Z = exp(−1) + 1\n\n最终 O = A / Z ≈ 17.31","after":["这里保存的 A 是尚未归一化的分子，并不是最终输出。online softmax 就是在分块过程中持续维护最大值、分母与分子。","对于逐元素激活，旧分数的激活值不依赖后来的分数。GDPA 可以直接累加每个 K/V tile 的贡献，不需要因为全行最大值改变而重缩放旧贡献。它仍然要做 QK、激活和 PV，不能理解成“只删一行 softmax”。"],"sources":[{"path":"gdpa/src/flash_fwd_sm100.py","label":"对照计算与输出路径：flash_fwd_sm100.py"}]},{"title":"仓库还针对哪些工作负载做了改动？","table":{"headers":["特点","用小例子理解"],"rows":[["变长任务调度","若四份工作的耗时近似为 8、7、2、1，把长短任务搭配，比把两个最长任务堆到同一个执行者上更容易平衡。这只是调度动机示意，真实分配以 tile 为单位。"],["短 K/V 的流水线","一次查询很快就读完 K/V 时，单个任务内部可重叠的阶段少；实现尝试在相邻输出任务之间交错安排计算。"],["激活近似","tanh GELU 与 Taylor GELU 是实现激活的不同方式。Taylor 多项式的有效输入范围需要单独检查，不能因名字里都有 GELU 就默认等价。"]]},"after":["读性能图时先分清：GDPA 与 FA4/FMHA 的中间数学不同；同为 GDPA 的两个实现也可能选了不同激活近似。然后再比较调度、流水线与资源使用。"],"sources":[{"path":"gdpa/README.md#features","label":"工作负载特点：README Features"},{"path":"gdpa/src/activation_utils.py","label":"激活及近似实现：activation_utils.py"}]}],"bridge":"先判断业务中间需要的是 softmax 还是逐元素激活，再看本轮的速度与误差。GDPA 比 FA4 快，并不能直接证明它能等价替换 FA4。"},"tlx_jfa":{"title":"同一组 Q，分别读取不同用户的历史","lead":"JFA 保留标准 softmax；它重点处理变长历史，以及 PMA 中跨用户共享的 Q。","intro":"先看 PMA 的前向：三个用户共享两个 query 向量 q₀、q₁，每个用户有自己的 K/V 历史。共享 Q 可以理解成大家使用相同的两种提问方式，但回答来自各自的历史。","sections":[{"title":"共享的是 Q，历史和输出各自独立","visual":"pma","paragraphs":["用户 A 有 3 个历史 token，B 有 1 个，C 有 4 个。同一组 [q₀, q₁] 分别对三份 K/V 做 softmax attention。每个用户得到 2 个输出，整个 batch 共 6 个；共享 Q 并不意味着三个用户的输出相同。"],"diagram":"O_A = softmax(Q K_Aᵀ / √D) V_A\nO_B = softmax(Q K_Bᵀ / √D) V_B\nO_C = softmax(Q K_Cᵀ / √D) V_C","after":["例如 B 只有一个历史 token。忽略 dropout，softmax 的唯一权重必为 1；若它的 V 是标量 10，q₀ 和 q₁ 的两个输出都是 10。A、C 有多条历史，两个 query 则可以给这些历史分配不同权重。","PMA 是 pooling by multi-head attention。在这个例子中，不论用户历史有多长，都被读成两个输出位置。代码中的 broadcast_q=True 表示输入只保留一份共享 Q，由调用接口把它用于不同用户的计算。"],"sources":[{"path":"tlx_jfa/README.md#supported-variants","label":"PMA 的支持范围：README"},{"path":"tlx_jfa/tests/test_tlx_jfa.py","label":"共享 Q 的前后向参考测试"}]},{"title":"Jagged：把不同长度的历史紧接着存放","paragraphs":["同样是 A、B、C，逻辑上把 3 + 1 + 4 = 8 个 token 拼在一起，用 offsets 标记每个用户的起点与终点。offsets 本身只描述边界，不执行 attention，也不把不同用户混到一起。"],"diagram":"K/V tokens = [A₀ A₁ A₂ | B₀ | C₀ C₁ C₂ C₃]\nK/V offsets = [0, 3, 4, 8]\n                A     B     C 的区间分别是\n              [0,3) [3,4) [4,8)\n\n共享 Q offsets = [0, 2]\n输出 offsets   = [0, 2, 4, 6]","after":["若统一 padding 到长度 4，逻辑上需要 3×4=12 个位置；packed 表示只放 8 个实际 token。这不等于底层没有对齐或 tile 的尾部开销。","Jagged 说的是序列长度和存储表示，不是块稀疏 mask。普通 self/cross attention 可以变长，PMA 的每个用户历史也可以变长。"],"sources":[{"path":"tlx_jfa/README.md#usage","label":"packed tensors 与 offsets：README Usage"}]},{"title":"反向：三个用户都要给同一份 Q 贡献梯度","paragraphs":["假设总 loss 是三个用户 loss 的和。q₀ 被 A、B、C 各用了一次，所以它的梯度必须累加这三次使用的贡献。q₁ 同理。若 loss 使用平均值，相应的缩放会由上游梯度带入。"],"diagram":"dQ = dQ_A + dQ_B + dQ_C\n\n例：对 q₀ 的某个分量\n  A 贡献 0.2\n  B 贡献 −0.1\n  C 贡献 0.4\n  最终梯度 = 0.5","after":["K_A/V_A、K_B/V_B、K_C/V_C 对应不同的输入区域，梯度仍各归各的历史。共享 Q 的求和只作用于那份被复用的 Q，不能把不同用户的 dK/dV 也加在一起。","这就是本页 FA4 基线为什么要计入前向 Q 展开和反向 dQ 求和：只把 Q 复制成三份跑完各自 attention，还没有完成共享输入的反向语义。"],"case":"pma","sources":[{"path":"tlx_jfa/README.md#usage","label":"共享 Q 梯度累加约定"},{"path":"tlx_jfa/tests/test_tlx_jfa.py","label":"PMA 参考中的 repeat 与 dQ sum"}],"mode":"bwd"},{"title":"还支持什么？2-CTA 又是在说什么？","table":{"headers":["名字","具体含义"],"rows":[["Self / cross attention","self 通常由同一序列提供 Q/K/V；cross 可以有 2 个 query 去读 4 个历史 token，Q 与 K/V 的长度独立。"],["对称滑动窗口","W=1 时，第 3 个位置可看位置 2、3、4。它包含右侧位置，不等于 causal attention。"],["Warp specialization","同一个 GPU 线程块里，给不同 warp 安排加载、矩乘或分数处理等工作，是实现分工。"],["2-CTA backward","CTA 即 GPU 线程块。两个 CTA 协作执行特定反向路径，不是“两份 query”或“两个用户”。"]]},"after":["该版本的 2-CTA 反向仅覆盖受限 PMA：broadcast_q、D=128、单 query group、无滑动窗口且启用负载均衡。这里“单 query group”指 Q 与 K/V 的 head 数相同，不是说 Q 只能有一个 token。其他支持配置会转到 1-CTA 反向；不能看到代码里有 2-CTA 就认为所有 case 都走它。"],"sources":[{"path":"tlx_jfa/README.md#layout","label":"1-CTA / 2-CTA 分派条件"},{"path":"tlx_jfa/src/tlx_jagged_flash_attention.py","label":"公共接口与分派实现"}]}],"bridge":"先确定是独立 Q，还是共享 Q 的 PMA；再对齐变长边界、窗口规则和 dQ 累加。它与 FA4 可以比较相同的 softmax 数学，但配置必须一致。"},"multi_cta_norm_fusion":{"title":"矩乘算完一行，能不能顺手把归一化也做完？","lead":"Norm Fusion 想减少 GEMM 与归一化之间的中间矩阵读写；难点是一行可能由多个 CTA 分头计算。","intro":"先看 GEMM → RMSNorm。假设 X 是 2×3，W 是 3×4，矩乘得到 Y 的两行、每行 4 个数。归一化需要知道同一行全部 4 个数的统计量。","sections":[{"title":"拿一行 [1, 2, 3, 4] 算 RMSNorm","paragraphs":["忽略 epsilon 和 affine 权重，RMSNorm 先求平方均值，再让整行除以它的平方根。"],"diagram":"Y 的一行 = [1, 2, 3, 4]\n平方和    = 1 + 4 + 9 + 16 = 30\n平方均值  = 30 / 4 = 7.5\nRMS       = √7.5 ≈ 2.739\n输出      ≈ [0.365, 0.730, 1.095, 1.461]","after":["LayerNorm 则先减行均值，再除以标准差。同一行的均值是 2.5、方差是 1.25，标准化后约为 [−1.342, −0.447, 0.447, 1.342]。两者都需要整行统计，但公式不同。"],"sources":[{"path":"multi_cta_norm_fusion/tests/test_tlx_matmul_rmsnorm.py","label":"GEMM → RMSNorm 参考"},{"path":"multi_cta_norm_fusion/tests/test_tlx_matmul_layernorm.py","label":"GEMM → LayerNorm 参考"}]},{"title":"Multi-CTA：每个线程块只算出一行的一部分","paragraphs":["为了说明分工，假设 CTA 0 负责前两列，CTA 1 负责后两列。每个 CTA 都只知道自己的局部平方和，不能据此完成整行 RMSNorm。实际 CTA 数由列宽和 tile 配置决定，不固定为两个。"],"diagram":"CTA 0：拿到 [1, 2] → 局部平方和 5\nCTA 1：拿到 [3, 4] → 局部平方和 25\n                     ↓ 交换并合并统计量\n                  整行平方和 30\n                     ↓\n两个 CTA 都用 √(30/4) 缩放各自的输出列","after":["这份 RMSNorm 实现中能直接看到跨 CTA 的 shared-memory 写入、barrier 等待和局部结果相加。CTA 之间交换的是归约所需的信息，而不是把整个输出行都重算一遍。"],"sources":[{"path":"multi_cta_norm_fusion/src/tlx_matmul_rmsnorm.py#L273","label":"_compute_rms_norm：跨 CTA 交换与归约"}]},{"title":"它想省什么，又可能多付出什么？","diagram":"分离执行：\n  GEMM → 完整 Y 写到显存 → Norm 再读 Y → 写最终输出\n\n融合的目标：\n  GEMM 得到局部 Y → 合并行统计 → 就地归一化 → 写最终输出","paragraphs":["目标是减少完整中间矩阵的写回、读入以及额外算子启动。最终输出和训练所需的统计量仍然可能需要保存。","代价是多个 CTA 的通信、等待，以及更复杂的资源分配。要看省下的时间能否抵消这些成本。本轮固定配置与高效的 cuBLAS + compiled Norm 对比，有些路径仍更慢；不能只跟 eager 实现比较。"],"case":"post_ln","sources":[{"path":"multi_cta_norm_fusion/README.md","label":"实现范围与测试配置说明"}]},{"title":"RMSNorm → GEMM 和反向，是另外两种数据流","paragraphs":["如果没有 affine 权重，RMSNorm 对每行只乘一个标量 r。精确算术下，可以把这个行缩放从矩乘前移到矩乘后："],"diagram":"RMSNorm(x) = r × x\n(r × x) @ W = r × (x @ W)","after":["例如 x=[3,4]，r=1/√12.5。无论先把 x 缩放再乘 W，还是先乘 W 再缩放输出，理想结果相同。但 BF16 中间舍入会破坏严格逐元素相等，因此本页比较时专门对齐了中间精度。","再看 norm → linear 这一段的反向：先做 dy @ Wᵀ，得到传回 norm 的梯度，再利用保存的归一化输入和统计量算 dX。仓库的两种 backward kernel 融合的是这段组合，不代表整个网络的所有参数梯度。"],"case":"pre_rms","sources":[{"path":"multi_cta_norm_fusion/tests/test_tlx_rmsnorm_matmul.py","label":"RMSNorm → GEMM 的参考与精度"},{"path":"multi_cta_norm_fusion/tests/test_tlx_matmul_layernorm_bwd.py","label":"GEMM + LayerNorm dX 的反向参考"}]}],"bridge":"先写清 Norm 在矩乘前还是后、保存哪些统计量、输出与中间精度是什么，再比较整段组合。测试默认配置的结果不能代表 full autotune 后的上限。"},"gdpa_megakernel":{"title":"把 attention 前后的几步一起算","lead":"Megakernel 扩大融合范围：把输入归一化、GDPA、残差和输出归一化接成一段。","intro":"普通 GDPA 关注 QKᵀ → 激活 → PV。真实模型还可能在前后接归一化和残差；这个项目尝试减少这些相邻步骤之间的中间数据传递。","sections":[{"title":"先从最短的组合开始：GDPA → RMSNorm","diagram":"Q、K、V\n   ↓ GDPA：tanh GELU 处理 QKᵀ，再聚合 V\nattention 输出 G\n   ↓ 对每个 token 的所有 head 特征做 RMSNorm\n最终输出 O","paragraphs":["同一个 token 可能有多个 head 的输出。这里的 RMSNorm 覆盖展平后的 H×D 个特征，不是每个 head 各做一次。"],"sources":[{"path":"gdpa_megakernel/tests/test_tlx_gdpa_megakernel.py","label":"fused RMSNorm 参考测试"}]},{"title":"一个 token 有两个 head，统计量要合在一起","paragraphs":["把维度缩小到 H=2、D=2，假设一个 token 的两个 head 输出分别是 [1,2] 和 [3,4]。"],"diagram":"head 0：[1, 2]    head 1：[3, 4]\n                 ↓ 展平看作同一个 token\n              [1, 2, 3, 4]\n                 ↓\n      RMS = √((1+4+9+16)/4) = √7.5\n                 ↓\nhead 0、head 1 使用同一个归一化系数","after":["如果分别按 [1,2]、[3,4] 求 RMS，会得到两个不同系数，算的就不是测试里的这个模型操作。attention 原本能按 head 分工；再融合跨 head 的 Norm，就增加了合并统计量与同步的要求。"],"sources":[{"path":"gdpa_megakernel/tests/test_tlx_gdpa_megakernel.py","label":"view(total_tokens, H×D) 的归一化范围"}]},{"title":"更完整的一段：LayerNorm → GDPA → 残差 → RMSNorm","diagram":"Q ──LayerNorm──→ Qn ──────────────┐\n                  │               │\n                  └─与 K、V 做 GDPA→ G\n                                  │\n                        G + Qn ←──┘\n                           ↓ RMSNorm\n                           O","paragraphs":["按仓库测试逐步读：① 每个 token 的 Q 先跨 H×D 做 LayerNorm；② 用 Qn 和原来的 K、V 做 GDPA；③ 把 Qn 加回 G；④ 再跨 H×D 做 RMSNorm。","残差加回的是归一化后的 Qn，不是原始 Q。融合版和分离版必须保持这个顺序、同一激活、相同 epsilon 与 dtype，才是在比较同一段计算。"],"case":"ln_residual","sources":[{"path":"gdpa_megakernel/tests/test_tlx_gdpa_megakernel.py#L122","label":"四步组合的逐行参考"}]},{"title":"名字叫 Megakernel，不等于一定更快","paragraphs":["它希望少写、少读中间张量，并减少独立算子的启动。但融合后，更多状态要同时留在片上，还可能增加跨 head 的等待。已经很快的分离实现，也可能比某个融合配置更快。","因此本页同时比较 eager Norm 和 compiled Norm。较大补充配置未返回的记录也单独保留，不能把小输入的成功外推到所有 shape。"],"sources":[{"path":"gdpa_megakernel/README.md","label":"测试入口与关闭全量 autotune 的说明"}]}],"bridge":"对照前先把整段计算画出来：归一化轴、残差加什么、在哪一步转 dtype。优化空间可能在融合范围，也可能在通信和配置；要由实际 shape 的数据支持。"},"block_attention":{"title":"每组内部互相看，组与组之间不看","lead":"固定块 attention 改变可见性规则：每个 query 只读取同一块里的 K/V。","intro":"假设某个模型明确允许把 192 条历史行为分成三组，每组 64 条。下面只说明这种模型规则的含义；具体业务是否允许这样分组，需要另外确认。","sections":[{"title":"192 条历史，分成三个独立的 64-token 块","diagram":"历史：[0…63] [64…127] [128…191]\n        A        B         C\n\n注意力可见性          K\n                   A   B   C\n              A    ■   ·   ·\n          Q   B    ·   ■   ·\n              C    ·   ·   ■\n\n■：块内所有 token 互相看\n·：没有跨块 attention","paragraphs":["A 组独立计算 softmax(Q_A K_Aᵀ / √D)V_A；B、C 同理。A 组最后一个 token 63 也不能看 B 组第一个 token 64，所以它不是一个跨边界滑动的局部窗口。"],"sources":[{"path":"block_attention/triton/tlx_block_attention.py#L556","label":"实现固定 BLOCK_D=64"},{"path":"block_attention/tests/block_attention_test.py","label":"逐块 attention 的参考与边界测试"}]},{"title":"少算了哪些东西？","table":{"headers":["模式","这个例子的 query-key 配对数"],"rows":[["全量 attention","192×192 = 36,864"],["三个独立块","3×64×64 = 12,288"]]},"paragraphs":["这里的配对数减少到三分之一，是因为模型本来就不要求跨组关联，不是因为 kernel 免费算出了同样的全局 attention。这个计数也不是实际运行时间的加速比。","这个实现的一个 Q 块只对应一个 K/V 块，完整块内分数可一次处理，因此无需跨多个 K/V tile 更新 online softmax 的历史状态。块内的最大值、指数、求和及归一化仍然要做。"],"sources":[{"path":"block_attention/triton/tlx_block_attention.py","label":"块内 QK、softmax 与 PV 的实现"}]},{"title":"放到推荐系统里，什么时候能用？","paragraphs":["如果模型只需要组内行为或分组特征交互，这种规则可能合适。例如先对每组局部编码，再由其他模块汇总或建立全局关系。这个 kernel 本身只完成块内交互，不会自动产生组摘要。","如果需求是“候选广告读取用户全部历史”，或“每个行为读取所有更早行为”，固定块规则就不匹配。连续堆多层、分组始终不变，也不会自动建立跨组联系。","真实历史不一定刚好是 64 的倍数。例如 70 个 token，会产生一个 64-token 块和一个 6-token 尾块；尾块必须正确屏蔽无效位置。"],"sources":[{"path":"block_attention/tests/block_attention_test.py","label":"变长与尾块的正确性测试"}]},{"title":"该怎样和 FA4 比？","paragraphs":["本页把每个 64-token 块作为 FA4 的一条独立序列，让两边拥有相同的可见性规则。拿本实现对比全长 192 的全局 FA4，会同时混入“少算了跨块配对”与“实现快慢”两种因素。","仓库还有 projection / RoPE 融合相关测试，但本页性能柱只覆盖 Block Attention 本体，不能把未计入的融合收益算进去。"],"case":"jagged","sources":[{"path":"block_attention/README.md","label":"项目入口"},{"path":"block_attention/tests/block_attention_test.py","label":"projection / RoPE 与独立 attention 测试"}]}],"bridge":"先决定模型能否接受块间没有 attention，再讨论速度。它和 Jagged 的“序列长度不一样”是两件事，也不是 GDPA 图里的 sparsity 参数。"},"lp_fa4":{"title":"attention 还是 softmax，变化在数值怎么存、怎么乘","lead":"LP-FA4 的低精度重点是 MXFP8：小组数据共享 scale，并让前后向矩乘消费这种表示。","intro":"LP 表示 Low Precision。它基于 FA4，提供 BF16 与 MXFP8 路径。理解它时，先沿着“原始张量 → 量化表示 → attention → 梯度输出”看一遍，比一开始进入 MMA 指令更容易。","sections":[{"title":"32 个值，共享一个 scale","paragraphs":["这里的 MXFP8 使用 E4M3 保存数值 payload，E8M0 保存每 32 个元素共用的 scale。D=128 的一行，沿 head dimension 划分时会有 4 组。"],"diagram":"一行 128 个元素\n[ 32 个 payload ] [ 32 个 ] [ 32 个 ] [ 32 个 ]\n       s₀            s₁        s₂        s₃\n\n重建值 ≈ payload × 本组 scale\n\n若某组 scale 恰为 2：\npayload 中的 [0.5, 1, 2] → 代表约 [1, 2, 4]","after":["最后一行只演示怎样解码，不是 rceil 选择 scale 的算法。实际量化通常有舍入误差。它也不是简单把所有 BF16 数值 cast 成 FP8：scale 必须一起存放并参加后续计算。"],"sources":[{"path":"lp_fa4/README.md#mxfp8-forward-and-backward","label":"MXFP8 的 payload、scale 与梯度格式"},{"path":"lp_fa4/src/lp_fa4/cute/mxfp8.py","label":"分组量化和数据结构"}]},{"title":"为什么有 hdim 和 seq 两个方向？","paragraphs":["32 个元素沿哪个方向分组，要对应矩乘相乘求和的方向。前向里的两次矩乘，求和维度不同。"],"table":{"headers":["计算","沿什么维度求和","前向使用的表示"],"rows":[["Q @ Kᵀ","每个 head 的 D 个特征","Q.hdim、K.hdim"],["P @ V","K/V 的 token 序列","V.seq"]]},"after":["按一行的特征分组，与按一列的 token 分组，会把不同数值放进同一个 32 元素小组，需要不同的 scale。给已经量化的数据换一个 transpose view，并不能自动得到另一方向正确的量化结果。","因此 API 可以保留两个方向的数据与 scale，供前向和反向的不同矩乘使用。量化后的显存占用和准备成本，也要把这些额外表示算进去。softmax 语义仍然保留，不能理解为所有中间量和统计都只用 8 bit。"],"sources":[{"path":"lp_fa4/src/lp_fa4/cute/mxfp8.py#L325","label":"orientations=hdim / seq / both"},{"path":"lp_fa4/README.md#mxfp8-forward-and-backward","label":"前后向保留两个方向的说明"}]},{"title":"同一个 forward，计时边界不同，答案就不同","diagram":"完整准备与计算：\nBF16 Q/K/V → 量化 payload + scale → MXFP8 attention → O\n             └──── 输入转换 ────┘   └── kernel ──┘\n\nREADME 原生 benchmark：\n先量化一次，再只重复测量 attention 调用","paragraphs":["如果上游已经提供合适的量化表示，预量化 kernel 的耗时很有意义。如果每次调用前都从 BF16 转换，就必须把这段准备一起计入。","本页分别列出同源 BF16、预量化 MXFP8，以及包含仓库当前 eager 量化 helper 的路径。后者反映现有 helper 的成本，不代表优化过的融合量化 kernel 能达到的水平。"],"case":"readme_b8_l2048","sources":[{"path":"lp_fa4/README.md#benchmark-reproduction","label":"README 明确排除输入量化的计时协议"},{"path":"lp_fa4/src/lp_fa4/benchmarks/mxfp8.py","label":"原生 benchmark 的实际调用边界"}]},{"title":"反向返回的也可能不是三份 BF16 梯度","diagram":"output_mxfp8_dkv=True 时：\n  dQ：BF16\n  dK：E4M3 payload + E8M0 scale\n  dV：E4M3 payload + E8M0 scale","paragraphs":["下游若能直接接收 MXFP8 dK/dV，就可以使用这个输出格式。若下游需要 BF16，就还要反量化和转换；本页另列了包含这部分开销的路径。API 不启用此选项时也保留三份 BF16 梯度的兼容结果。","速度之外，要一起看 output、dQ、dK、dV 的误差。cosine 接近 1 表示方向相近，SQNR 越高表示相对误差信号越小；通过当前随机输入阈值，仍不能替代业务数据上的训练质量验证。"],"sources":[{"path":"lp_fa4/README.md#mxfp8-forward-and-backward","label":"显式 backward 的输出约定"},{"path":"lp_fa4/tests/mxfp8_smoke.py","label":"反量化与 cosine / SQNR 检查"}]}],"bridge":"它仍然是 softmax attention，优势来自低精度计算与数据表示。评估时同时问：输入是否已量化、下游需要哪种梯度格式、误差能否接受。"}},"reports":{"tlx_jfa":{"headline":"与 FA4 对齐 softmax 语义后比较","summary":"覆盖定长、滑动窗口、共享 Q 的 PMA，以及一组较大定长输入。PMA 的 FA4 路径计入 Q 展开和 dQ 跨 batch 求和；不能据小输入结果推断所有 recsys 场景。 已完成的 8 组对照中，目标实现的中位耗时有 3 组更低；相对指定基线的速度范围为 0.43–1.17×。这些是本轮观测值。","scope":"仓库 7 项测试；定长 / 对称窗口 / PMA 的前后向。额外 B=32、L=512 为吞吐观察配置，未覆盖完整 GQA、head dimension 或业务分布。","limitations":["TLX 使用原生 autotune；静态调度表在计时前生成。窗口=32 时两边均为对称窗口。","PMA 的 Q 扩展计入 FA4 前向；反向包含共享 Q 的梯度求和。双方计算范围对齐，但数据表示不同。"],"providers":{"tlx":"TLX JFA","fa4":"FA4 · CuTe"},"patches":[],"test_note":"全部 7 项仓库测试通过，包括空 KV、零步 tile 和错误 max length 的拒绝检查。","reading":"先看 tests/test_tlx_jfa.py 的输入与参考，再跟 tlx_jagged_flash_attention 的 dispatch、调度表与前后向 kernel。","next":["先确认目标业务是否需要共享 Q 或变长负载均衡。","对较大输入复测并观察 CTA 数与 GPU 利用率，再判断是否存在调度或访存优化空间。"],"method":["新增项目使用 CUDA Graph 测量 GPU 稳态开销：预热并完成编译后，在 graph 内展开 10 次调用，预热约 200 ms；采集 50 组样本，每组回放 5 次并除以 50。p20/p50/p80 是这些平均耗时样本的分位数，不是置信区间。","同一配置的各实现在同一作业、同一 GPU 上比较。排除 JIT、autotune、CPU 调用、输入生成与调度表构建。反向单独计时，所需前向输出在计时前准备；GPU 上的梯度清零、规约、转换等仍按调用路径计入。","每个计时实现先对对应输入检查输出或梯度。精度失败的路径不生成性能柱；正确性测试通过只适用于已测输入及阈值。与 GDPA 页的 Triton do_bench 协议不同，不做跨项目耗时排名。","这是一次 B200 首轮复现；未做跨节点重复、业务 shape 扫描、时钟锁定或 profiler 归因。小差异应通过重复实验再判断。","BF16，H=2、D=128，seed=42。每组配置的输出与 dQ/dK/dV 对比 FP32 PyTorch 参考，前向 atol=rtol=0.02，反向 0.03。仓库原有测试保持其更严格的原阈值。","benchmark 包装层缓存 compute_balanced_tiles 与 precompute_static_bwd_varlen_tiles 的静态输出，不修改 attention 计算。原生 Python 调度表生成耗时不在本图内。"],"cases":[{"id":"dense","title":"定长 · 仓库测试","shape_label":"B 3 · L 128 · H 2 · D 128","origin":"仓库正确性测试形状。","comparison_note":"全量 noncausal self attention，包含训练所需中间量。","baseline":"fa4","rows":[{"provider":"tlx","mode":"fwd","validation":{"status":"passed","atol":0.02,"rtol":0.02,"relative_l2":0.0023237315472215414,"max_abs":0.00390625},"median_ms":0.015215359926223755,"p20_ms":0.015204351663589478,"p80_ms":0.015239295721054077,"samples_ms":[0.015248639583587647,0.01521664023399353,0.015226 免把版本差异混入精度差异。","scaling_mode=rceil，seed=0。预量化 MXFP8 正向不包含输入转换；含输入量化路径使用仓库当前的 PyTorch eager helper，覆盖 Q/K 的 hdim 与 V 的 seq 方向。这不是优化过的融合量化 kernel 成本。训练所需其他量化方向的生成不包含在此正向项中。","独立反向假定 Q/K/V 的 both 方向量化输入已准备，不包含前向或输入量化。dK/dV 转回 BF16 路径包含输出反量化与 cast，并使用 torch.compile 将每个梯度的转换融合为单个 pointwise 路径。","大配置另外对原始 BF16 输入的 FP32 PyTorch SDPA 参考检查 output/dQ/dK/dV。沿用仓库 MXFP8 阈值：output cosine>0.98、SQNR>8 dB；dQ cosine>0.97、SQNR>10 dB；dK/dV cosine>0.97、SQNR>8 dB。","原生 README benchmark 采用 CUDA Event、1000 ms 预热、5000 ms 测量、每样本 5 次调用，包含 Python 发射间隙。它和主图 CUDA Graph 的绝对数值不能直接混用。"],"cases":[{"id":"readme_b8_l2048","title":"README 参考配置","shape_label":"B 8 · Q=KV 2048 · H 16 · D 128","origin":"README 原生 benchmark 配置。","comparison_note":"MXFP8 与同源 BF16 attention；正向转换使用仓库 eager helper，反向转换使用 compiled 反量化。","baseline":"lp_bf16","rows":[{"provider":"lp_mxfp8","mode":"fwd","validation":{"status":"passed","quality":[{"name":"out","cosine":0.9985668659210205,"sqnr_db":25.42916574878599,"min_cosine":0.98,"min_sqnr_db":8}]},"median_ms":0.21516703605651855,"p20_ms":0.20950591659545897,"p80_ms":0.21701440811157227,"samples_ms":[0.2095884895324707,0.2096499252319336,0.20952703475952147,0.2093849563598633,0.20942144393920897,0.20940864562988282,0.20942655563354493,0.20932863235473634,0.2091788864135742,0.20923328399658203,0.20933759689331055,0.2093484878540039,0.21012287139892577,0.20941055297851563,0.2095257568359375,0.2122047996520996,0.21475519180297853,0.21471551895141602,0.2162291145324707,0.21917312622070312,0.21892032623291016,0.219169921875,0.22043968200683595,0.21936895370483397,0.21923391342163087,0.2192064094543457,0.21863487243652344,0.21696767807006836,0.21697471618652345,0.2169900894165039,0.21694208145141602,0.2171116828918457,0.21527999877929688,0.21471744537353515,0.21458560943603516,0.21674560546875,0.21697280883789063,0.2168307113647461,0.21691007614135743,0.21691328048706054,0.21693887710571289,0.21687744140625,0.21588287353515626,0.21595968246459962,0.21718143463134765,0.2150540733337402 <script>(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('site-data').textContent);
  const PROVIDERS = [
    {id:'triton_gdpa',name:'GDPA · Triton',short:'Triton GDPA',color:'#4285f4'},
    {id:'cutlass_fmha',name:'CUTLASS FMHA',short:'CUTLASS FMHA',color:'#ea4335'},
    {id:'cutedsl_fa4',name:'FA4 · CuTe',short:'FA4',color:'#e9ab00'},
    {id:'cutedsl_gdpa',name:'GDPA · CuTe',short:'CuTe GDPA',color:'#34a853'}
  ];
  const SCENARIOS = {
    dense:{title:'定长 Self Attention',label:'定长 self · Q = KV',description:'每个样本的 Q、K、V 长度相同。',test:r=>r.set==='self' && r.sparsity===1},
    jagged:{title:'变长 Q Attention',label:'变长 Q · sparsity = 0.5',description:'每个样本的 Q 长度在 1 到 Q max 之间随机生成；K/V 长度固定为 Q max。',test:r=>r.set==='self' && r.sparsity===0.5},
    cross:{title:'短 KV Cross Attention',label:'短 KV cross · KV = 256',description:'Q 长度依次增加，所有样本的 K/V 长度保持为 256。',test:r=>r.set==='short_kv'}
  };
  const Q_LENGTHS = [256,512,1024,2048];
  const defaults = {project:'gdpa',view:'results',mode:'fwd',scenario:'dense',metric:'latency',baseline:'cutedsl_fa4',providers:PROVIDERS.map(p=>p.id),range:true,highlight:false,case:''};
  const $ = id => document.getElementById(id);
  const escape = v => String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const selected = (a,b) => a===b?' selected':'';
  const pct = v => `${(v*100).toFixed(3)}%`;
  const fmt = (v,metric='latency') => metric==='tflops'?v.toFixed(1):metric==='speedup'?`${v.toFixed(2)}×`:v<1?v.toFixed(3):v.toFixed(2);
  const modeName = m => m==='fwd'?'前向':'反向';
  let state = readHash();
  let toastTimer;

  function readHash() {
    const query = new URLSearchParams(location.hash.slice(1));
    const s = {...defaults,providers:[...defaults.providers]};
    const valid = {project:DATA.projects.map(p=>p.id),view:['results','concepts','method','reading','overview'],mode:['fwd','bwd'],scenario:Object.keys(SCENARIOS),metric:['latency','tflops','speedup'],baseline:PROVIDERS.map(p=>p.id)};
    for(const [key,values] of Object.entries(valid)) if(values.includes(query.get(key))) s[key]=query.get(key);
    if(query.has('providers')) {
      const ids=query.get('providers').split(',').filter(x=>defaults.providers.includes(x));
      if(ids.length) s.providers=[...new Set(ids)];
    }
    s.range=query.get('range')!=='0';
    if(s.project!=='gdpa' && !DATA.reports?.[s.project]) s.view='overview';
    else if(s.view==='overview') s.view='results';
    s.case=query.get('case')||'';
    return s;
  }
  function update(patch,focusId) {
    state={...state,...patch};
    const q=new URLSearchParams();
    for(const key of ['project','view','mode','scenario','metric','baseline','case']) q.set(key,state[key]);
    if(state.providers.length!==4) q.set('providers',state.providers.join(','));
    if(!state.range) q.set('range','0');
    history.replaceState(null,'',`#${q}`);
    render();
    if(focusId) $(focusId)?.focus({preventScroll:true});
  }
  function toast(message) {
    $('toast').textContent=message; $('toast').classList.add('visible');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2500);
  }
  function filteredRows() { return DATA.gdpa.rows.filter(r=>r.mode===state.mode && SCENARIOS[state.scenario].test(r)); }
  function metricValue(r,rows) {
    if(state.metric==='latency') return r.median_ms;
    if(state.metric==='tflops') return r.tflops;
    const base=rows.find(b=>b.provider===state.baseline && b.q_max===r.q_max);
    return base.median_ms/r.median_ms;
  }
  function wins(mode) {
    let count=0;
    for(const scenario of Object.values(SCENARIOS)) for(const q of Q_LENGTHS) {
      const group=DATA.gdpa.rows.filter(r=>r.mode===mode && scenario.test(r) && r.q_max===q);
      const ours=group.find(r=>r.provider==='cutedsl_gdpa');
      if(group.length===4 && ours.median_ms===Math.min(...group.map(r=>r.median_ms))) count++;
    }
    return count;
  }
  function render() {
    document.querySelector('.chart-tooltip')?.remove();
    const project=DATA.projects.find(p=>p.id===state.project);
    const assessed=DATA.projects.filter(p=>p.complete||DATA.reports?.[p.id]).length;
    document.querySelector('.progress-label strong').textContent=`${assessed} / ${DATA.projects.length}`;
    document.querySelector('.progress-label span').textContent='已开展评估';
    document.querySelector('.progress-track i').style.width=`${assessed/DATA.projects.length*100}%`;
    document.title=`${project.name} · Kernel Bench`;
    $('project-nav').innerHTML=DATA.projects.map((p,i)=>`<a class="project-link ${p.id===state.project?'active':''}" ${p.id===state.project?'aria-current="page"':''} href="#project=${p.id}${state.view==='concepts'?'&view=concepts':''}"><span class="project-number">0${i+1}</span><span class="project-name">${escape(p.navName||p.name)}</span><span class="project-status-dot" aria-hidden="true"></span></a>`).join('');
    $('mobile-project').innerHTML=DATA.projects.map(p=>`<option value="${p.id}"${selected(p.id,state.project)}>${escape(p.name)} · ${p.complete?'已有实测':'待评估'}</option>`).join('');
    $('project-header').innerHTML=`<div class="eyebrow">${project.complete?'BENCHMARK REPORT':'PROJECT NOTES'} / ${String(DATA.projects.indexOf(project)+1).padStart(2,'0')}</div><div class="hero-row"><div><div class="hero-title ${project.name.length>20?'long-title':''}"><h1>${escape(project.name)}</h1><span class="badge ${project.complete?'':'pending'}">${escape(project.statusLabel||(project.complete?'首轮实测完成':'待评估'))}</span></div><p class="hero-description">${escape(project.description)}</p></div><div class="hero-actions"><a class="button" href="${project.readme}" target="_blank" rel="noopener noreferrer">项目 README <span aria-hidden="true">↗</span></a>${project.complete?'<button class="button primary" data-action="download">下载当前数据 <span aria-hidden="true">↓</span></button>':''}</div></div><div class="context-line">${project.tags.map(t=>`<span>${escape(t)}</span>`).join('')}<span class="context-date">${project.complete?(project.id==='gdpa'?'实测 2026.11.18–19':'实测 2026.11.19'):'已完成 README 与入口盘点'}</span></div>`;
    const tabs=project.complete?[['results','性能结果'],['concepts','原理与例子'],['method','方法与精度'],['reading','阅读路线']]:[['overview','项目概览']];
    $('view-tabs').innerHTML=tabs.map(([id,label])=>`<button class="view-tab ${state.view===id?'active':''}" data-view="${id}" id="tab-${id}" aria-current="${state.view===id?'page':'false'}">${label}</button>`).join('');
    const content=state.view==='concepts'?conceptView(project):DATA.reports?.[project.id]?(state.view==='method'?otherMethod(project):state.view==='reading'?otherReading(project):otherResults(project)):!project.complete?pendingView(project):state.view==='method'?methodView():state.view==='reading'?readingView(project):resultsView();
    $('content').innerHTML=(state.view==='results'?conceptEntry(project):'')+content;
    if(project.id==='gdpa') bindChart();
  }
  function reportSelection(project) {
    const report=DATA.reports[project.id];
    const c=report.cases.find(c=>c.id===state.case)||report.cases[0];
    if(!c) return {report,c:null,rows:[],mode:state.mode};
    const modes=[...new Set(c.rows.map(r=>r.mode))];
    const mode=modes.includes(state.mode)?state.mode:(modes[0]||'fwd');
    return {report,c,mode,rows:c.rows.filter(r=>r.mode===mode)};
  }
  function otherResults(project) {
    const {report,c,rows,mode}=reportSelection(project);
    const passed=report.tests.filter(t=>t.status==='passed').length;
    const count=report.cases.reduce((n,c)=>n+c.rows.length,0);
    const stats=`<section class="stats-strip"><div class="stat"><div class="stat-label">本轮正确性测试</div><div class="stat-number">${passed}<span>/ ${report.tests.length}</span></div><div class="stat-caption">通过数 / 已选测试，不代表完整覆盖</div></div><div class="stat"><div class="stat-label">取得计时的配置</div><div class="stat-number">${report.cases.filter(c=>c.rows.length).length}<span>/ ${report.cases.length}</span></div><div class="stat-caption">各配置可能只完成部分实现</div></div><div class="stat"><div class="stat-label">通过精度检查后的计时</div><div class="stat-number">${count}<span> 条</span></div><div class="stat-caption">失败与未覆盖范围单独列出</div></div></section>`;
    const intro=`<section class="panel prose-panel"><div class="section-kicker">OBSERVATIONS</div><h2>${escape(report.headline)}</h2><p>${escape(report.summary)}</p>${report.limitations.map(x=>`<p class="report-note">${escape(x)}</p>`).join('')}</section>`;
    if(!c) return stats+intro+otherMethod(project);
    const metric=state.metric==='speedup'?'speedup':'latency';
    const base=rows.find(r=>r.provider===c.baseline)||null;
    const value=r=>metric==='speedup'?(base?base.median_ms/r.median_ms:0):r.median_ms*1000;
    const maximum=Math.max(...rows.map(r=>metric==='latency'&&state.range?r.p80_ms*1000:value(r)),.00001);
    const colors=['#34a853','#4285f4','#e9ab00','#9981c2'];
    const chart=rows.length?`<div class="report-bars" role="img" aria-label="${escape(c.title)} ${modeName(mode)} 的耗时对比，具体数值见下表">${rows.map((r,i)=>{
      const v=value(r),label=report.providers[r.provider]||r.provider;
      const lo=r.p20_ms*1000/maximum*100,hi=r.p80_ms*1000/maximum*100;
      return `<div class="report-bar-row"><div class="report-bar-label">${escape(label)}<strong>${metric==='latency'?v.toFixed(2)+' µs':v.toFixed(2)+'×'}</strong></div><div class="report-bar-track"><div class="report-bar-fill" style="width:${Math.max(.3,v/maximum*100)}%;background:${colors[i%colors.length]}"></div>${metric==='latency'&&state.range?`<div class="report-whisker" style="left:${lo}%;width:${Math.max(.1,hi-lo)}%"></div>`:''}</div></div>`;
    }).join('')}</div>`:`<p class="no-timing">该配置尚未取得通过验证的计时。原因见下方记录。</p>`;
    const table=`<div class="data-table-scroll"><table class="report-table"><thead><tr><th>实现</th><th>中位耗时 / µs</th><th>p20–p80 / µs</th><th>相对基线速度</th><th>精度检查</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escape(report.providers[r.provider]||r.provider)}</td><td>${(r.median_ms*1000).toFixed(3)}</td><td>${(r.p20_ms*1000).toFixed(3)}–${(r.p80_ms*1000).toFixed(3)}</td><td>${base?(base.median_ms/r.median_ms).toFixed(2)+'×':'未建立'}</td><td>${r.validation.status==='passed'?'通过本轮阈值':'待检查'}</td></tr>`).join('')}</tbody></table></div>`;
    const failures=(c.failures||[]).map(f=>`<p class="report-error"><strong>${escape(report.providers[f.provider]||f.provider)}</strong> · ${escape(f.message)}</p>`).join('');
    return stats+intro+`<section class="panel"><div class="panel-heading"><div><div class="section-kicker">PERFORMANCE</div><h2>${escape(c.title)}</h2><p class="panel-subtitle">${escape(c.shape_label)} · ${modeName(mode)}</p></div></div><div class="filters"><div class="filter"><label for="case-select">配置</label><select id="case-select">${report.cases.map(item=>`<option value="${escape(item.id)}"${selected(c.id,item.id)}>${escape(item.title)}</option>`).join('')}</select></div><div class="filter"><label for="report-mode">计算方向</label><select id="report-mode">${[...new Set(c.rows.map(r=>r.mode))].map(m=>`<option value="${m}"${selected(mode,m)}>${modeName(m)}</option>`).join('')}</select></div><div class="filter"><label for="report-metric">查看指标</label><select id="report-metric"><option value="latency"${selected(metric,'latency')}>耗时 · µs</option><option value="speedup"${selected(metric,'speedup')} ${base?'':'disabled'}>相对基线速度</option></select></div><label class="range-toggle"><input id="range-toggle" type="checkbox" ${state.range?'checked':''}>显示 p20–p80</label></div><div class="formula-note"><span><strong>比较范围。</strong> ${escape(c.comparison_note)} ${escape(c.origin)}</span></div>${chart}<p class="chart-caption">${metric==='latency'?'柱长为中位耗时，越短越快。细线是中间 60% 计时样本所在范围，不是置信区间。':'速度比 = 基线中位耗时 ÷ 当前实现中位耗时。'} 基线：${escape(report.providers[c.baseline]||c.baseline)}。<br>这里是 CUDA Graph 的 GPU 稳态计时；不能直接与 GDPA 页的另一套计时协议合并排名。</p>${table}${failures?`<div class="report-failures">${failures}</div>`:''}</section><section class="panel prose-panel"><h2>本轮覆盖范围</h2><p>${escape(report.scope)}</p><button class="text-action" data-view="method">查看环境、正确性与测量方法 →</button></section>`;
  }
  function otherMethod(project) {
    const report=DATA.reports[project.id];
    const native=report.native_benchmark;
    const nativeSection=native?`<section class="panel prose-panel"><h2>README 原生 benchmark</h2><p>按仓库命令运行：预热 ${native.warmup_ms} ms，测量 ${native.measure_ms} ms，每样本 ${native.launches_per_sample} 次调用。CUDA Event 计时，输入已量化，反向输出 MXFP8 dK/dV。以下结果与主图 CUDA Graph 协议不同。</p><div class="data-table-scroll"><table><thead><tr><th>方向</th><th>中位耗时 / µs</th><th>均值 / µs</th><th>名义 TFLOPS · 按均值</th><th>样本数</th></tr></thead><tbody>${Object.entries(native.results).map(([mode,r])=>`<tr><td>${modeName(mode)}</td><td>${(r.median_ms*1000).toFixed(2)}</td><td>${(r.mean_ms*1000).toFixed(2)}</td><td>${r.tflops.toFixed(1)}</td><td>${r.samples}</td></tr>`).join('')}</tbody></table></div></section>`:'';
    return nativeSection+`<section class="panel prose-panel"><div class="section-kicker">METHOD & SCOPE</div><h2>怎样读这一轮数据</h2>${report.method.map(x=>`<p>${escape(x)}</p>`).join('')}<div class="download-row"><a class="button" href="data/${project.id}/report.json" download>下载完整公开记录</a></div></section><section class="panel prose-panel"><h2>环境与来源</h2><dl class="fact-list">${Object.entries(report.environment).map(([k,v])=>`<div><dt>${escape(k)}</dt><dd>${escape(v)}</dd></div>`).join('')}</dl><p class="source-commit">仓库版本 <code>${DATA.revision}</code></p>${report.patches.map(p=>`<p>${escape(p)}</p>`).join('')}</section><section class="panel prose-panel"><h2>正确性测试记录</h2><p>${escape(report.test_note)}</p><div class="data-table-scroll"><table class="report-test-table"><thead><tr><th>测试</th><th>结果</th><th>说明</th></tr></thead><tbody>${report.tests.map(t=>`<tr><td>${escape(t.name)}</td><td>${escape({passed:'通过',failed:'失败',error:'运行失败',skipped:'跳过'}[t.status]||t.status)}</td><td>${escape(t.note||'仓库原有阈值')}</td></tr>`).join('')}</tbody></table></div></section><section class="panel prose-panel"><h2>每条计时的精度检查</h2><p>下列指标来自对应计时输入；不同实现的误差阈值和参考口径见条目内容。</p>${report.cases.map(c=>`<details class="details-box"><summary>${escape(c.title)}</summary>${c.rows.map(r=>`<p><strong>${escape(report.providers[r.provider]||r.provider)} · ${modeName(r.mode)}</strong></p><pre class="quality-json">${escape(JSON.stringify(r.validation,null,2))}</pre>`).join('')}</details>`).join('')}</section>`;
  }
  function otherReading(project) {
    const report=DATA.reports[project.id];
    return `<section class="panel prose-panel"><h2>从实测结果进入源码</h2><p>${escape(report.reading)}</p><ul class="next-step-list">${report.next.map(x=>`<li>${escape(x)}</li>`).join('')}</ul><div class="download-row"><a class="button" href="${project.readme}" target="_blank" rel="noopener noreferrer">打开固定版本 README ↗</a></div></section><section class="panel prose-panel"><h2>仓库已有能力</h2><ul class="next-step-list">${project.facts.map(x=>`<li>${escape(x)}</li>`).join('')}</ul></section>`;
  }

  // Explanations live separately from timing records and report adapters.
  function conceptEntry(project) {
    const guide=DATA.concepts[project.id];
    if(!guide) return '';
    return `<aside class="concept-entry"><div><span class="section-kicker">先读懂它在算什么</span><p>${escape(guide.lead)}</p></div><button class="button" data-view="concepts">用例子看懂 <span aria-hidden="true">→</span></button></aside>`;
  }
  function pmaFlow() {
    return `<figure class="pma-figure" aria-label="同一组 Q 分别读取 A 的三个、B 的一个、C 的四个历史 token，每个用户得到两个输出">
      <div class="pma-flow"><div class="pma-query"><span>大家共用的两种提问</span><strong>共享 Q</strong><div class="query-tokens"><b>q₀</b><b>q₁</b></div><small>输入只放一份</small></div>
        <div class="pma-users">${[['A',3],['B',1],['C',4]].map(([name,count])=>`<div class="pma-user"><div class="pma-history"><strong>用户 ${name} 的 K/V</strong><div class="history-tokens">${Array.from({length:count},(_,i)=>`<span>${name}${['₀','₁','₂','₃'][i]}</span>`).join('')}</div><small>${count} 个历史 token</small></div><span class="pma-arrow" aria-hidden="true">→</span><div class="pma-output"><strong>${name} 的 2 个输出</strong><small>q₀、q₁ 各得到一个回答</small></div></div>`).join('')}</div>
      </div><figcaption>Q 相同，每个人读取的历史不同；输出仍然各自独立。</figcaption></figure>`;
  }
  function conceptView(project) {
    const guide=DATA.concepts[project.id];
    const paragraphs=items=>(items||[]).map(p=>`<p>${escape(p)}</p>`).join('');
    const sourceBase=`https://github.com/facebookresearch/ads_model_kernel_library/blob/${DATA.revision}/`;
    return `<div class="concept-guide">
      <section class="panel concept-intro"><div class="section-kicker">原理与例子 / ${escape(project.name)}</div><h2>${escape(guide.title)}</h2><p class="concept-lead">${escape(guide.lead)}</p><p>${escape(guide.intro)}</p><p class="concept-scope">小例子用于理解计算，实际 benchmark shape 见“性能结果”。说明依据本轮固定版本的 README 与参考测试，原文链接放在各节末尾。</p>
        <nav class="concept-outline" aria-label="本页例子">${guide.sections.map((s,i)=>`<button data-concept-section="${i}"><span>${String(i+1).padStart(2,'0')}</span>${escape(s.title)}</button>`).join('')}</nav>
      </section>
      ${guide.sections.map((s,i)=>`<section class="panel concept-section" id="concept-section-${i}" aria-labelledby="concept-heading-${i}" tabindex="-1"><div class="concept-section-heading"><span class="concept-number" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><h2 id="concept-heading-${i}">${escape(s.title)}</h2></div>
        ${paragraphs(s.paragraphs)}${s.visual==='pma'?pmaFlow():''}
        ${s.diagram?`<pre class="concept-diagram" tabindex="0" aria-label="${escape(s.title)}的计算示意"><code>${escape(s.diagram)}</code></pre>`:''}
        ${s.table?`<div class="concept-table-scroll" tabindex="0" role="region" aria-label="${escape(s.title)}的对照表"><table class="concept-table"><thead><tr>${s.table.headers.map(h=>`<th scope="col">${escape(h)}</th>`).join('')}</tr></thead><tbody>${s.table.rows.map(row=>`<tr>${row.map((cell,j)=>j===0?`<th scope="row">${escape(cell)}</th>`:`<td>${escape(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}
        ${paragraphs(s.after)}
        <footer class="concept-sources"><span>对照原文</span>${(s.sources||[]).map(src=>`<a href="${escape(sourceBase+src.path)}" target="_blank" rel="noopener noreferrer">${escape(src.label)} <span aria-hidden="true">↗</span></a>`).join('')}${s.case?`<button class="text-action" data-example-case="${escape(s.case)}" data-example-mode="${s.mode==='bwd'?'bwd':'fwd'}">查看对应配置的${s.mode==='bwd'?'反向':''}实测 →</button>`:''}</footer>
      </section>`).join('')}
      <section class="panel concept-bridge"><div class="section-kicker">从例子回到评估</div><h2>带着这个问题看性能</h2><p>${escape(guide.bridge)}</p><div class="download-row"><button class="button primary" data-view="results">查看性能结果 →</button><button class="button" data-view="method">方法与精度</button><button class="button" data-view="reading">源码阅读路线</button></div></section>
    </div>`;
  }

  function resultsView() {
    const rows=filteredRows();
    const scenario=SCENARIOS[state.scenario];
    const metricLabel=state.metric==='latency'?'耗时 / ms · 越低越好':state.metric==='tflops'?'名义 Tensor Core TFLOPS · 越高越好':`相对 ${PROVIDERS.find(p=>p.id===state.baseline).short} 的速度 · 越高越好`;
    const baseOptions=PROVIDERS.map(p=>`<option value="${p.id}"${selected(p.id,state.baseline)}>${p.short}</option>`).join('');
    return `<section class="stats-strip" aria-label="全部十二组配置的汇总"><div class="stat"><div class="stat-label">前向 · CuTe GDPA 耗时最低</div><div class="stat-number">${wins('fwd')}<span>/ 12</span></div><div class="stat-caption">全部场景，共 12 组四实现对照</div></div><div class="stat"><div class="stat-label">反向 · CuTe GDPA 耗时最低</div><div class="stat-number">${wins('bwd')}<span>/ 12</span></div><div class="stat-caption">长序列定长 self 有一个例外</div></div><div class="stat"><div class="stat-label">成功取得的计时</div><div class="stat-number">${DATA.gdpa.rows.length}<span>/ 96</span></div><div class="stat-caption">48 前向 + 48 反向 · 精度验证另列</div></div></section>

  function niceAxis(max) {
    const raw=Math.max(max,0.00001)/4;
    const power=10**Math.floor(Math.log10(raw));
    const step=([1,2,2.5,3,4,5,10].find(n=>n*power>=raw)||10)*power;
    return {max:Math.ceil(max*1.04/step)*step,step};
  }
  function chart(rows) {
    const visible=PROVIDERS.filter(p=>state.providers.includes(p.id));
    const values=rows.filter(r=>state.providers.includes(r.provider)).map(r=>state.metric==='latency'&&state.range?r.p80_ms:metricValue(r,rows));
    const axis=niceAxis(Math.max(...values, state.metric==='speedup'?1:0));
    const W=920,H=310,L=57,R=18,T=27,B=49,PW=W-L-R,PH=H-T-B;
    const y=v=>T+PH-(v/axis.max)*PH;
    let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">${escape(SCENARIOS[state.scenario].title)} · ${modeName(state.mode)}</title><desc id="chart-desc">${state.metric==='latency'?'中位耗时，越低越好':'吞吐或相对速度，越高越好'}。四种序列长度，各实现的准确数值见下方数据表。</desc>`;
    for(let v=0;v<=axis.max+axis.step/10;v+=axis.step) {
      const label=state.metric==='speedup'?`${v.toFixed(1)}×`:axis.max<2?v.toFixed(2):axis.max<10?v.toFixed(1):String(Math.round(v));
      svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e7ede9" stroke-width="1"/><text x="${L-12}" y="${y(v)+4}" text-anchor="end" fill="#8b9993" font-size="10">${label}</text>`;
    }
    if(state.metric==='speedup') svg+=`<line x1="${L}" x2="${W-R}" y1="${y(1)}" y2="${y(1)}" stroke="#597c6a" stroke-width="1" stroke-dasharray="4 4"/>`;
    Q_LENGTHS.forEach((q,i)=>{
      const cx=L+(i+.5)*PW/4,barW=Math.min(37,(PW/4-35)/visible.length),gap=6,total=visible.length*barW+(visible.length-1)*gap;
      if(state.highlight && q===2048) svg+=`<rect x="${cx-PW/8+9}" y="${T-13}" width="${PW/4-18}" height="${PH+22}" rx="8" fill="#eaf2ec" opacity=".6"/>`;
      visible.forEach((p,j)=>{
        const r=rows.find(r=>r.provider===p.id && r.q_max===q);
        const v=metricValue(r,rows),x=cx-total/2+j*(barW+gap),top=y(v),height=PH+T-top;
        svg+=`<rect class="bar" data-point="${p.id}:${q}" tabindex="0" aria-label="${p.short}，Q ${q}，${fmt(v,state.metric)} ${state.metric==='latency'?'毫秒':state.metric==='tflops'?'TFLOPS':'相对速度'}" x="${x}" y="${top}" width="${barW}" height="${Math.max(height,.5)}" rx="3" fill="${p.color}"/>`;
        if(state.metric==='latency' && state.range) {
          const bx=x+barW/2,hi=y(r.p80_ms),lo=y(r.p20_ms);
          svg+=`<path d="M${bx},${hi}V${lo}M${bx-3},${hi}H${bx+3}M${bx-3},${lo}H${bx+3}" stroke="#284537" stroke-opacity=".65" fill="none" stroke-width="1" pointer-events="none"/>`;
        }
        svg+=`<text x="${x+barW/2}" y="${Math.min(top,state.metric==='latency'&&state.range?y(r.p80_ms):top)-7}" fill="#60746a" text-anchor="middle" font-size="10" pointer-events="none">${fmt(v,state.metric)}</text>`;
      });
      svg+=`<text x="${cx}" y="${H-27}" text-anchor="middle" fill="#51685d" font-size="12">${q}</text>`;
    });
    svg+=`<text x="${L+PW/2}" y="${H-4}" text-anchor="middle" fill="#8b9993" font-size="10">${state.scenario==='dense'?'Q / KV length':'Maximum Q length'}</text></svg>`;

  function dataTable(rows) {
    const visible=PROVIDERS.filter(p=>state.providers.includes(p.id));
    const unit=state.metric==='latency'?'ms':state.metric==='tflops'?'TFLOPS':'相对速度';

      return `<tr class="${state.highlight&&q===2048?'highlight-row':''}"><td class="shape-cell"><strong>Q ${q}</strong><small>KV ${rs[0].kv_len}</small></td>${rs.map((r,i)=>`<td class="${vs[i]===best?'best':''}" title="中位耗时 ${r.median_ms.toFixed(6)} ms；p20–p80 ${r.p20_ms.toFixed(6)}–${r.p80_ms.toFixed(6)} ms">${fmt(vs[i],state.metric)}${vs[i]===best?`<span class="best-mark">${state.metric==='latency'?'最低':'最高'}</span>`:''}</td>`).join('')}</tr>`;

    return `<table aria-label="当前场景的四种序列长度对比"><thead><tr><th scope="col">序列长度</th>${head}</tr></thead><tbody>${body}</tbody></table>`;

    return `<section class="panel prose-panel"><div class="section-kicker">COMPUTATION</div><h2>同一张图里，有两种计算语义</h2><p>两边都包含 QK 与 PV 两次矩阵乘，但中间的处理不同。GDPA 的快慢可以作为工作负载参考，不能直接视为标准 attention 的替换收益。</p><div class="formula-grid"><div class="formula-box"><span>GDPA · 激活函数</span><code>O = activation(QKᵀ) V</code></div><div class="formula-box"><span>FA4 / FMHA · 归一化</span><code>O = softmax(QKᵀ / √D) V</code></div></div><div class="data-table-scroll" style="padding:0"><table><thead><tr><th>实现</th><th>本轮执行的路径</th><th>比较时的边界</th></tr></thead><tbody><tr><td>GDPA · Triton</td><td>tanh 近似 GELU；QK scale = 1</td><td>GDPA 基线</td></tr><tr><td>GDPA · CuTe</td><td>前向：六阶 Taylor GELU；反向：tanh / Taylor 混合</td><td>两种 GDPA 的数值公式仍不完全相同</td></tr><tr><td>FA4 · CuTe</td><td>softmax attention</td><td>不同数学操作的性能对照</td></tr><tr><td>CUTLASS FMHA</td><td>softmax attention</td><td>不同数学操作的性能对照</td></tr></tbody></table></div></section>
    <div class="method-grid"><section class="panel prose-panel"><div class="section-kicker">ENVIRONMENT</div><h2>测试环境</h2><dl class="fact-list"><div><dt>GPU</dt><dd>NVIDIA B200 · SM100</dd></div><div><dt>功率上限</dt><dd>1000 W；未锁定频率</dd></div><div><dt>精度 / 形状</dt><dd>BF16 · B=1152 · H=4 · D=128</dd></div><div><dt>PyTorch CUDA</dt><dd>${escape(fwd.torch_cuda)}</dd></div><div><dt>前向 / 反向</dt><dd>11 月 18 日 / 19 日，两次独立运行</dd></div><div><dt>作者环境</dt><dd>B200 · 750 W · CUDA 13.0</dd></div></dl><p>机器与版本条件不同，不能把与原图的差异全部归因于 kernel 实现。</p></section><section class="panel prose-panel"><div class="section-kicker">MEASUREMENT</div><h2>计时范围</h2><dl class="fact-list"><div><dt>正式测量</dt><dd>${fwd.warmup_ms} ms 预热 + ${fwd.rep_ms} ms 测量窗口</dd></div><div><dt>统计量</dt><dd>中位数、p20、p80；区间不是置信区间</dd></div><div><dt>前向</dt><dd>调用前向；tile-map 预处理在计时外</dd></div><div><dt>反向</dt><dd>前向与 tile-map 预处理在计时外；计时调用包含梯度清理与 autograd backward</dd></div><div><dt>FLOPs</dt><dd>前向统计 QK + PV；反向按前向的 2.5 倍</dd></div><div><dt>首次调参</dt><dd>fbtriton 使用默认自动调参；首次预热耗时单独于正式计时</dd></div></dl></section></div>
    <section class="panel prose-panel"><div class="section-kicker">NUMERICAL VALIDATION</div><h2>小规模检查通过，适用范围仍有限</h2><p>前向检查输入 scale = 0.25；反向检查输入 std = 0.1。下表为相对 L2 误差，反向取 dQ / dK / dV 中的最大值。GDPA 反向参考为 FP32 tanh GELU，FA4 / FMHA 参考为 FP32 softmax。GDPA 前向另外用 P 转 BF16 的参考做逐元素检查。这些检查不覆盖全部计时项的大规模输入。</p><div class="data-table-scroll" style="padding:0"><table><thead><tr><th>实现</th><th>前向参考</th><th>前向相对 L2</th><th>反向最大相对 L2</th></tr></thead><tbody>${validationRows}</tbody></table></div><details class="details-box"><summary>CuTe GDPA 的精度边界需要特别区分</summary><p>输入 scale = 0.25 时，相对执行的 Taylor 公式误差约 ${pct(fwd.validation.cutedsl_gdpa.relative_l2_to_implemented_formula)}，但相对 tanh GELU 约 ${pct(fwd.validation.cutedsl_gdpa.gelu_reference_relative_l2)}。这两个数字回答的是不同问题。</p><p>输入 std = 1 时，CuTe GDPA 对 BF16 Taylor 参考的严格逐元素检查未通过；相对 tanh GELU 的误差更大。Taylor 近似的输入域与业务归一化条件需要单独确认。反向混合近似也不是全 Taylor 前向的精确导数。</p><p>因此，这轮结果是性能复现与小输入检查，尚不能作为全输入分布或生产训练精度认证。详细数值保留在环境与验证 JSON 中。</p></details></section>

  function bindChart() {
    const svg=document.querySelector('.chart-svg'); if(!svg) return;
    const show=(target,event)=>{
      if(!target?.dataset.point) return;
      document.querySelector('.chart-tooltip')?.remove();
      const [provider,q]=target.dataset.point.split(':');
      const r=filteredRows().find(r=>r.provider===provider && r.q_max===Number(q));
      const p=PROVIDERS.find(p=>p.id===provider);
      const tip=document.createElement('div'); tip.className='chart-tooltip'; tip.setAttribute('role','tooltip');
      tip.innerHTML=`<strong>${p.name}</strong><br><span>Q ${q} / KV ${r.kv_len} · ${modeName(state.mode)}</span><br>中位耗时　${r.median_ms.toFixed(4)} ms<br>p20–p80　${r.p20_ms.toFixed(4)}–${r.p80_ms.toFixed(4)} ms<br>吞吐　　　${r.tflops.toFixed(1)} TFLOPS`;
      document.body.append(tip);
      const box=target.getBoundingClientRect();
      const x=event?.clientX??box.x+box.width/2,y=event?.clientY??box.y;
      tip.style.left=`${Math.max(10,Math.min(x+13,innerWidth-tip.offsetWidth-12))}px`;
      tip.style.top=`${Math.max(10,Math.min(y+15,innerHeight-tip.offsetHeight-12))}px`;
    };
    svg.addEventListener('pointerover',e=>show(e.target.closest('[data-point]'),e));
    svg.addEventListener('pointerout',()=>document.querySelector('.chart-tooltip')?.remove());
    svg.addEventListener('focusin',e=>show(e.target));
    svg.addEventListener('focusout',()=>document.querySelector('.chart-tooltip')?.remove());
  }

      const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';
      const csv=fields.join(',')+'\n'+rows.map(r=>fields.map(f=>quote(f==='project'?project.id:f==='case'?c.id:f==='validation'?JSON.stringify(r.validation):r[f])).join(',')).join('\n');
      const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
      const a=document.createElement('a');a.href=url;a.download=`${project.id}-${c.id}-${mode}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${rows.length} 条计时`);return;
    }
    const rows=filteredRows().filter(r=>state.providers.includes(r.provider));
    const fields=['mode','set','sparsity','q_max','kv_len','batch','heads','head_dim','q_tokens','provider','activation_formula','median_ms','p20_ms','p80_ms','tflops','status'];
    const quote=v=>`"${String(v??'').replaceAll('"','""')}"`;
    const csv=fields.join(',')+'\n'+rows.map(r=>fields.map(f=>quote(r[f])).join(',')).join('\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    const link=document.createElement('a'); link.href=url;link.download=`gdpa-${state.mode}-${state.scenario}.csv`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(`已导出 ${rows.length} 个计时，包含原始毫秒数与采样区间`);
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button) return;
    if(button.dataset.view) {
      const fromContent=Boolean(button.closest('#content'));
      update({view:button.dataset.view},`tab-${button.dataset.view}`);
      if(fromContent) $('view-tabs').scrollIntoView({block:'start'});
    }
    if(button.dataset.conceptSection!==undefined) {
      const section=$(`concept-section-${button.dataset.conceptSection}`);
      section?.focus({preventScroll:true});
      section?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
    }
    if(button.dataset.exampleCase) {
      update({view:'results',case:button.dataset.exampleCase,mode:button.dataset.exampleMode||'fwd',metric:'latency'},'case-select');
      $('case-select')?.scrollIntoView({block:'center'});
    }
    if(button.dataset.mode) update({mode:button.dataset.mode,highlight:false},`mode-${button.dataset.mode}`);
    if(button.dataset.action==='reset') update({...defaults,providers:[...defaults.providers]});
    if(button.dataset.action==='download') downloadCurrent();
    if(button.dataset.action==='inspect-exception') {update({view:'results',mode:'bwd',scenario:'dense',metric:'latency',providers:[...defaults.providers],highlight:true});$('explorer').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});}
  });
  document.addEventListener('change',event=>{
    const target=event.target;
    if(target.id==='case-select') update({case:target.value},target.id);
    if(target.id==='report-mode') update({mode:target.value},target.id);
    if(target.id==='report-metric') update({metric:target.value},target.id);
    if(target.id==='mobile-project') location.hash=`project=${target.value}${state.view==='concepts'?'&view=concepts':''}`;
    if(target.id==='scenario-select') update({scenario:target.value,highlight:false},target.id);
    if(target.id==='metric-select') update({metric:target.value},target.id);
    if(target.id==='baseline-select') update({baseline:target.value},target.id);
    if(target.id==='range-toggle') update({range:target.checked},target.id);
    if(target.dataset.provider) {
      const next=target.checked?[...state.providers,target.dataset.provider]:state.providers.filter(x=>x!==target.dataset.provider);
      if(!next.length) {target.checked=true;toast('至少保留一种实现');return;}
      update({providers:next},target.id);
    }
  });
  $('share-view').addEventListener('click',async()=>{
    try {await navigator.clipboard.writeText(location.href);toast('当前项目和筛选条件的链接已复制');}
    catch {toast('可复制地址栏链接，筛选条件已保存在链接中');}
  });
  window.addEventListener('hashchange',()=>{state=readHash();render();});
  window.addEventListener('keydown',event=>{if(event.key==='Escape') document.querySelector('.chart-tooltip')?.remove();});
  render();
})();
</script>
</body>
</html>
